name: Require Change Intent
description:
  Fails pull requests that do not add a `.changeset/` intent (`pnpm change`, or
  `pnpm change --bump none` for changes that need no release). The release PR is
  exempt unless the base branch has new intents it has not applied yet. Requires
  the pull request merge commit checked out with `fetch-depth` set to 2.

runs:
  using: node24
  main: index.ts
