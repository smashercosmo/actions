name: Create Release PR
description:
  Applies pending change intents with `pnpm version -r`, commits them to the
  release branch through the GitHub API, so the commit is signed, then opens or
  updates the release pull request.

inputs:
  token:
    description: GitHub App installation token with write access to contents and pull requests.
    required: true
  base:
    description: Branch targeted by the release pull request.
    default: main
  branch:
    description: Branch used for the release pull request.
      It is overwritten on every run, so reserve it for this action only.
    default: release
  format-command:
    description: Optional formatter command for files changed by `pnpm version`,
      for example `pnpm oxfmt`.

outputs:
  pr-number:
    description: Number of the created or updated release pull request.

runs:
  using: node24
  main: index.ts
