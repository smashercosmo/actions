name: Create Release PR
description:
  Applies pending change intents with `pnpm version -r`, then opens or updates
  the release pull request.

inputs:
  token:
    description: GitHub App installation token with write access to contents and pull requests.
    required: true
  app-slug:
    description: GitHub App slug to use for the release commit author.
    required: true
  base:
    description: Branch targeted by the release pull request.
    default: main
  branch:
    description: Branch used for the release pull request. It is force-pushed
      on every run, so reserve it for this action.
    default: release
  format-command:
    description: Optional formatter command for files changed by `pnpm version`,
      for example `pnpm oxfmt`.

outputs:
  pr-number:
    description: Number of the created or updated release pull request.

runs:
  using: node24
  main: index.ts
