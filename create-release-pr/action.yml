name: Create Release PR
description: GitHub Action for applying pending change intents with `pnpm version -r` and opening (or updating) a release PR with the result. The PR is opened from the `branch` input, which is force-pushed on every run. Does nothing when the pending intents only decline a release (`--bump none`). Needs pnpm and the installed dependencies of the repository

inputs:
  token:
    description: GitHub App installation token with `contents` and `pull-requests` write permissions
    required: true
  app-slug:
    description: GitHub App slug, used as the commit author
    required: true
  base:
    description: Branch the release PR targets
    default: main
  branch:
    description: Branch the release PR is opened from. Force-pushed on every run, so it must not be used for anything else
    default: release
  format-command:
    description: Command that formats the files `pnpm version` changed, e.g. `pnpm exec oxfmt`. The changed files are appended to it as arguments. Nothing is formatted when it's empty

outputs:
  pr-number:
    description: Number of the opened or updated release PR

runs:
  using: node24
  main: dist/index.js
