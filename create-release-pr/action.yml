name: Create Release PR
description:
  GitHub Action for applying pending change intents with `pnpm version -r`
  and opening (or updating) a release PR with the result.

inputs:
  token:
    description: GitHub App installation token with `contents` and `pull-requests` write permissions.
    required: true
  app-slug:
    description: GitHub App slug, used as the commit author.
    required: true
  base:
    description: Branch the release PR targets.
    default: main
  branch:
    description: Branch the release PR is opened from. Force-pushed on every run, so it must not be used for anything else.
    default: release
  format-command:
    description: Command that formats the files `pnpm version` changed, e.g. `pnpm oxfmt`.

outputs:
  pr-number:
    description: Number of the opened or updated release PR

runs:
  using: node24
  main: dist/index.js
