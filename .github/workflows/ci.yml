name: CI

# Reusable CI for pnpm workspaces that use `pnpm change` intents. It runs the
# standard root scripts (`build`, `lint`, `format --check`, `test`) when present.
on:
  workflow_call:
    inputs:
      playwright-browsers:
        description: Playwright browsers to install before the tests, separated by spaces, e.g. `chromium webkit firefox`. Nothing is installed when it's empty
        type: string
        default: ""

permissions: {}

# Pull requests cancel older runs for the same branch. Pushes use unique groups
# so release-related runs are not accidentally cancelled or queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required PR check for change intents. Dependabot is skipped because it
  # cannot generate intents and dependency bumps do not release this package.
  changeset:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Fetch the PR merge commit and parents so `HEAD^1..HEAD` is the PR diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require a change intent
        uses: $/require-change-intent

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      # Catch invalid package names or bump types before release planning.
      - name: Validate change intents
        run: pnpm change status

      # Build first so lint/tests can consume generated sibling package output.
      - name: Build
        run: pnpm run --if-present build

      # Build output must either be committed or ignored.
      - name: Check that the build leaves no changes
        run: |
          changed=$(git status --porcelain)

          if [ -n "$changed" ]; then
            echo "::error::The build changed these files. Run \`pnpm build\` and commit the result, or ignore the files if they shouldn't be committed"
            echo "$changed"
            git diff
            exit 1
          fi

      - name: Lint and type-check
        run: pnpm lint

      - name: Check formatting
        run: pnpm format --check

      # Install browsers with the Playwright version used by the workspace.
      - name: Install Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          dir=$(pnpm ls -r --depth 0 --json playwright | jq -r '
            map(select((.dependencies.playwright // .devDependencies.playwright).version))
            | first.path // empty
          ')

          if [ -z "$dir" ]; then
            echo "::error::\`playwright-browsers\` is set, but no workspace package depends on Playwright"
            exit 1
          fi

          read -ra browsers <<< "$BROWSERS"
          pnpm --dir "$dir" exec playwright install --with-deps "${browsers[@]}"

      - name: Test
        run: pnpm run --if-present test
