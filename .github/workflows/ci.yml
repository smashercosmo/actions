name: CI

# Reusable CI workflow for pnpm workspaces tracking version changes via change
# intents (`pnpm change`). Called by downstream consumer repositories on pull
# requests and pushes to `main`, and invoked by this repository's release
# workflow before publishing to npm. See the README for usage instructions.
#
# Executes standard root-level workspace scripts: `pnpm build`, `pnpm lint`,
# `pnpm format --check`, and `pnpm test` (if defined).
on:
  workflow_call:
    inputs:
      playwright-browsers:
        description: Playwright browsers to install before the tests, separated by spaces, e.g. `chromium webkit firefox`. Nothing is installed when it's empty
        type: string
        default: ""

permissions: {}

# Explicit timeouts are set for all jobs to avoid holding GitHub Actions runners
# for the default 6-hour limit if a process (such as a browser test) hangs.

# Concurrency configuration:
# - Pull requests: grouped by branch ref; pushing new commits cancels in-flight runs.
# - Other events (e.g. push to main): assigned a unique group via `github.run_id` so
#   runs execute concurrently without queueing or auto-cancelling (which would bypass
#   automated release steps).
# - Prefixed with `github.workflow` so caller workflows (e.g. CI vs. Release) do not
#   conflict. Calling workflows should not define top-level concurrency groups.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Enforces that every pull request includes a change intent (`pnpm change` or
  # `pnpm change --bump none` for changes that require no release). Intended as a
  # required status check on `main`. Skipped on direct pushes and during release
  # workflow runs (skipped jobs satisfy required status checks).
  #
  # Skipped for Dependabot PRs because automated dependency bumps do not warrant
  # package releases and Dependabot cannot generate intents. The PR author is
  # verified via `github.event.pull_request.user.login` to prevent spoofing via
  # `github.actor`.
  changeset:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Fetches the PR merge commit and its parents (`fetch-depth: 2`). `HEAD^1`
      # points to the target base branch tip, allowing `HEAD^1..HEAD` to isolate
      # the changes introduced by the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require a change intent
        uses: $/require-change-intent

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      # Validates change intents against package names and valid bump types,
      # catching syntax or schema errors in PRs before they reach the release workflow.
      - name: Validate change intents
        run: pnpm change status

      # Runs build prior to linting so workspace packages that rely on emitted types
      # or build artifacts from sibling packages can resolve them.
      - name: Build
        run: pnpm build

      # Verifies that `pnpm build` leaves the working tree clean, detecting
      # stale, uncommitted build artifacts or unignored generated files.
      - name: Check that the build leaves no changes
        run: |
          changed=$(git status --porcelain)

          if [ -n "$changed" ]; then
            echo "::error::The build changed these files. Run \`pnpm build\` and commit the result, or ignore the files if they shouldn't be committed"
            echo "$changed"
            git diff
            exit 1
          fi

      - name: Lint and type-check
        run: pnpm lint

      - name: Check formatting
        run: pnpm format --check

      # `pnpm install` doesn't download the browsers or their system packages.
      # Installs both with the Playwright of the first workspace package that
      # depends on it, so the browsers match the version the tests run.
      - name: Install Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          dir=$(pnpm ls -r --depth 0 --json playwright | jq -r '
            map(select((.dependencies.playwright // .devDependencies.playwright).version))
            | first.path // empty
          ')

          if [ -z "$dir" ]; then
            echo "::error::\`playwright-browsers\` is set, but no workspace package depends on Playwright"
            exit 1
          fi

          read -ra browsers <<< "$BROWSERS"
          pnpm --dir "$dir" exec playwright install --with-deps "${browsers[@]}"

      - name: Test
        run: pnpm run --if-present test
