name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the release workflow run the same checks before it drafts a release
  workflow_call:

permissions: {}

# Every job has a timeout, here and in the other workflows: the default is six
# hours

# Pull requests: one run per branch, a new push cancels the old run. Everything
# else gets a group of its own (the run id), so runs never wait for each other:
# GitHub cancels a waiting run when a newer one arrives, and a cancelled check
# would silently skip a release. `github.workflow` is the calling workflow's
# name when this one is called from the release workflow
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pull request has to add a change intent: `pnpm change`, or
  # `pnpm change --bump none` when the change needs no release. A required
  # status check of the main branch ruleset, like `check`. Skipped on pushes and
  # in the release workflow, and a skipped job counts as a passed check
  #
  # Also skipped for Dependabot's pull requests: they update the actions the
  # workflows use, which never needs a release, and Dependabot can't add an
  # intent. The author of a pull request can't be faked, unlike `github.actor`,
  # which is whoever pushed last
  changeset:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The merge commit of the pull request and its parents: HEAD^1 is the tip
      # of the base branch, so HEAD^1..HEAD is what the pull request changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require a change intent
        run: |
          # The release PR applies the intents instead of adding one. It's the
          # only pull request that changes the ledger, which is also how the
          # release workflow recognizes it
          if ! git diff --quiet HEAD^1 HEAD -- .changeset/ledger.yaml; then
            echo "Release PR, no change intent needed"
            exit 0
          fi

          added=$(git diff --name-only --diff-filter=A HEAD^1 HEAD -- '.changeset/*.md' ':!.changeset/README.md')

          if [ -z "$added" ]; then
            echo "::error::This pull request doesn't add a change intent. Run \`pnpm change\` and commit the file it creates, or \`pnpm change --bump none\` if the change needs no release"
            exit 1
          fi

          echo "Change intents added:"
          echo "$added"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm from "packageManager" and Node from "devEngines.runtime"
      # in package.json, then runs `pnpm install --frozen-lockfile`. Without a
      # cache: what is built here is compared with what the actions run from,
      # and a cache is one more way for something foreign to get into it
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      # Fails on a change intent pnpm can't read, e.g. an unknown package or
      # bump type, which would otherwise only fail the release workflow on main
      - name: Validate change intents
        run: pnpm change status

      - name: Lint and type-check
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec oxfmt --check

      - name: Build
        run: pnpm build

      # GitHub runs the actions from the committed `dist` folders, so they have
      # to be exactly what the sources build to. Fails when a change to the
      # sources or the dependencies was committed without rebuilding, or when
      # `dist` was edited by hand
      - name: Check that the built actions are up to date
        run: |
          changed=$(git status --porcelain -- '*/dist')

          if [ -n "$changed" ]; then
            echo "::error::The committed dist folders don't match the sources. Run \`pnpm build\` and commit the result"
            echo "$changed"
            git diff -- '*/dist'
            exit 1
          fi
