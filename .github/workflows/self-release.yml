name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: $/.github/workflows/release.yml
    with:
      app-client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      include-private: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
