name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # `id-token` and `pages` aren't used here, as neither `npm` nor `docs` is
    # enabled, but GitHub checks the permissions of the skipped jobs too.
    permissions:
      contents: write
      id-token: write
      pages: write
    uses: $/.github/workflows/release.yml
    with:
      app-client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      include-private: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
