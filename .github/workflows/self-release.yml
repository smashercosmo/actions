name: Release

# Release of this repository: the reusable release workflow, from the same
# commit (`$/`). Nothing is published to npm: the actions and workflows are
# used straight from this repository, by the commit hash of a release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      # Only the publish job asks for it, and it doesn't run without `npm`.
      # GitHub still checks the permissions of every job in the called
      # workflow when the run starts, so it has to be allowed here
      id-token: write
    uses: $/.github/workflows/release.yml
    with:
      app-client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      # The package of this repository is private: it's never published to
      # npm, only versioned and tagged
      include-private: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
