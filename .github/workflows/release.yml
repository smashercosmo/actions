name: Release

# Every push to main does one of the following:
# - pending change intents in .changeset/ → apply them with `pnpm version -r`
#   and open (or update) a release PR with the bumped version and changelog.
#   Intents that decline a release (`pnpm change --bump none`) don't open one:
#   they stay in .changeset/ until the next release PR removes them
# - the release PR was just merged (.changeset/ledger.yaml changed) → create a
#   draft GitHub release from the CHANGELOG.md section of the new version.
#   Publishing the draft creates the tag
# - otherwise → nothing
# Running it manually (workflow_dispatch) without pending intents always takes
# the release path, e.g. to retry a failed release
#
# Nothing is published to npm: the actions are used straight from this
# repository, by the commit hash of a release
#
# The workflow uses the actions of this repository. They are referenced with
# `$/`, the repository at the commit the workflow runs on, so they don't depend
# on what's checked out and need no install: their `dist` folders are committed
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# No concurrency group for the whole workflow, on purpose. Runs in a group wait
# for each other, and GitHub cancels a waiting run when a newer one arrives. A
# quick push right after merging the release PR would cancel the run that was
# about to release, before it even decided what to do. So every push gets its
# own `plan`, and only the jobs that must not overlap share a group

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the plan step can compare HEAD with the commit
          # main pointed to before the push
          fetch-depth: 0

      # A push can contain several commits, e.g. a rebase-merge, and the
      # ledger may have changed in any of them. So the whole push is compared
      # (BEFORE..HEAD), not just the last commit. BEFORE is missing from the
      # history after a force-push and is all zeros for a new branch: then the
      # last commit is compared, as a fallback
      - id: plan
        name: Decide what to do
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE:-missing}^{commit}" 2>/dev/null; then
            BEFORE=HEAD^
          fi

          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md 2>/dev/null | grep -q .; then
            echo "action=pr" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet "$BEFORE" HEAD -- .changeset/ledger.yaml; then
            echo "action=release" >> "$GITHUB_OUTPUT"
          else
            echo "action=none" >> "$GITHUB_OUTPUT"
          fi

  # Pushes the release branch and opens the PR with the GitHub App token, so
  # the PR triggers other workflows (GITHUB_TOKEN-created ones don't)
  release-pr:
    needs: plan
    if: needs.plan.outputs.action == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: release
    # One at a time, as they force-push the same branch. A waiting run that
    # gets cancelled by a newer one is fine here: the newer one opens the PR
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tip of the branch, not the commit that triggered the run: runs
          # can start out of order, and the PR must be built from the latest
          # main, or an older run would overwrite a newer PR
          ref: ${{ github.ref }}

      # Installs pnpm from "packageManager" and Node from "devEngines.runtime"
      # in package.json, then runs `pnpm install --frozen-lockfile`: the
      # release PR action runs `pnpm version` and oxfmt
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      - id: app-token
        uses: $/create-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update release PR
        uses: $/create-release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          format-command: pnpm exec oxfmt

  # The same checks as CI, on the exact commit that is about to be released.
  # Among them that the committed `dist` folders match the sources, as those
  # are what a release hands out
  verify:
    needs: plan
    if: needs.plan.outputs.action == 'release'
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  # Waits for verify, so a draft is only created for a commit that passed.
  # Draft releases don't need to trigger other workflows, so GITHUB_TOKEN is
  # enough
  release:
    needs: [plan, verify]
    if: needs.plan.outputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Two runs never create drafts at the same time, or both would create one
    # for the same version
    concurrency:
      group: release-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the action looks up the commit that set the version,
          # to tag that one
          fetch-depth: 0

      # The action lists the packages with pnpm
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      - name: Create draft GitHub release
        uses: $/create-github-release
        with:
          token: ${{ github.token }}
          draft: true
          # The package of this repository is private: it's never published
          # to npm, only versioned and tagged
          include-private: true
