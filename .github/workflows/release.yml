name: Release

# Reusable release workflow for pnpm workspaces. On each push it decides whether to:
#
# - Open or update a release PR when packages need version updates.
# - Stage packages on npm after a release PR merge, when `npm` is enabled.
# - Do nothing when no release work is pending.
#
# Every run also tries to create missing GitHub releases. With `npm` enabled,
# public package releases wait until the version is approved and visible on npm.
#
# Require release PR branches to be up to date before merging, so newer change
# intents cannot be skipped by an older release PR.
#
on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App that opens the release PR
        type: string
        required: true
      npm:
        description: Stage packages on npm after running CI on the commit to be released
        type: boolean
        default: false
      include-private:
        description: Also create GitHub releases for versioned private packages, e.g. packages that are tagged but not published to npm
        type: boolean
        default: false
      playwright-browsers:
        description: Playwright browsers to install before CI tests. Only used when `npm` is enabled
        type: string
        default: ""
      npm-approval-timeout:
        description: Minutes to wait, after staging, for the staged versions to be approved on npm before giving up. At most 20. Only used when `npm` is enabled
        type: number
        default: 10
    secrets:
      app-private-key:
        description: Private key of the GitHub App that opens the release PR
        required: true

permissions: {}

# Queue release workflows instead of cancelling them; the run started by merging
# a release PR must survive long enough to stage and release that version.
concurrency:
  group: release-${{ github.workflow }}
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: plan
        name: Decide what to do
        uses: $/plan-release

  release-pr:
    needs: plan
    if: needs.plan.outputs.action == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Use the branch tip after this run reaches the queue. An older push
          # SHA can still contain intents already consumed by a merged release
          # PR, which would open a duplicate release PR. Up-to-date branch
          # protection would stop that PR from merging; this avoids creating it.
          ref: ${{ github.ref }}

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true

      - id: app-token
        uses: $/create-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update release PR
        uses: $/create-release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          format-command: pnpm format

  # Recheck the exact commit that will be published, without npm credentials in
  # the same job as build/test dependency code.
  verify:
    needs: plan
    if: needs.plan.outputs.action == 'release' && inputs.npm
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml
    with:
      playwright-browsers: ${{ inputs.playwright-browsers }}

  publish:
    needs: [plan, verify]
    if: needs.plan.outputs.action == 'release' && inputs.npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Stage packages on npm
        run: pnpm stage publish -r

  # Create any missing GitHub release for the current version. This still runs
  # after skipped or failed publish jobs; with `npm`, the action releases only
  # versions already visible on npm.
  #
  # The merge run waits for npm approval and holds the release queue. Later runs
  # check once, which catches approvals that happened after the merge run gave up.
  release:
    needs: [plan, verify, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    # `npm-approval-timeout` is capped at 20 minutes.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Full history finds the version commit; tags make release creation idempotent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true

      - name: Create GitHub releases
        uses: $/create-github-release
        with:
          token: ${{ github.token }}
          include-private: ${{ inputs.include-private }}
          npm: ${{ inputs.npm }}
          npm-wait-minutes: ${{ needs.publish.result == 'success' && inputs.npm-approval-timeout || 0 }}
