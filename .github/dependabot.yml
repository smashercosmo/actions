version: 2

updates:
  # Keep pinned workflow action SHAs current in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week so broken or malicious action releases can be pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
