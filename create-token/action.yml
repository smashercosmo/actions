name: Create GitHub App Token
description: Creates a repository-scoped GitHub App installation access token.

inputs:
  client-id:
    description: GitHub App client ID.
    required: true
  private-key:
    description: GitHub App private key in PEM format.
    required: true
  permission-pull-requests:
    description: Pull request permission for the token. Use `read` or `write`.
  permission-contents:
    description: Repository contents permission for the token. Use `read` or `write`.

outputs:
  token:
    description: GitHub App installation access token.
  app-slug:
    description: GitHub App slug.

runs:
  using: node24
  main: index.ts
  post: post.ts
