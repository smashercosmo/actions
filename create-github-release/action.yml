name: Create GitHub Release
description:
  Creates a GitHub release from CHANGELOG.md once the package version is ready.
  Creating the release also creates its tag. Requires pnpm and a checkout with
  full history and tags.

inputs:
  token:
    description: GitHub token with `contents` write permission.
    required: true
  include-private:
    description: Also create releases for versioned private packages, such as
      packages that are tagged in GitHub but not published to npm.
    default: "false"
  npm:
    description: Create public package releases only after the version is
      available on npm. Staged versions count only after approval.
    default: "false"
  npm-wait-minutes:
    description:
      Minutes to wait for the package version to appear on npm, checking every
      30 seconds. `0` checks once. Used only when `npm` is enabled.
    default: "0"

outputs:
  tag:
    description:
      Tag of the current version, `v<version>`, once its release exists, whether
      this run created it or an earlier one did. Empty while the version isn't on
      npm yet, and when no package needs a release.

runs:
  using: node24
  main: index.ts
