name: Create GitHub Release
description: GitHub Action for creating a tag and GitHub release, based on CHANGELOG.md, for the current version of every public workspace package that doesn't have a release yet. Needs pnpm and the full git history of the repository

inputs:
  token:
    description: GitHub token with `contents` write permission
    required: true
  include-private:
    description: Also release private packages that have a version, e.g. a repository that is versioned and tagged but never published to npm
    default: "false"
  draft:
    description: Create draft releases. The tag is created once a draft is published. Tags that already have a release, draft or not, are skipped
    default: "false"

runs:
  using: node24
  main: dist/index.js
