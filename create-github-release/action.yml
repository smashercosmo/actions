name: Create GitHub Release
description:
  GitHub Action for creating a draft GitHub release, based on CHANGELOG.md.
  Publishing a draft creates its tag. Needs pnpm and the full git history of the repository.

inputs:
  token:
    description: GitHub token with `contents` write permission.
    required: true
  include-private:
    description:
      Also release private packages that have a version,
      e.g. a repository that is versioned and tagged but never published to npm.
    default: "false"

runs:
  using: node24
  main: dist/index.js
